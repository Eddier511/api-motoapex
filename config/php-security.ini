; Apply at PHP worker startup through Hostinger/provider configuration.
; Do not publish phpinfo(), copy blindly to .htaccess, or rely on .user.ini/ini_set
; for directives needed before automatic request parsing.
expose_php=Off
display_errors=Off
log_errors=On
error_reporting=E_ALL
session.upload_progress.enabled=Off
file_uploads=Off
enable_post_data_reading=Off
post_max_size=256K
upload_max_filesize=256K
memory_limit=128M
max_execution_time=30
max_input_vars=1000
max_input_nesting_level=16
allow_url_include=Off
