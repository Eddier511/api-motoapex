# Isolated CI fixture only. HTTPS is simulated so tests exercise hosting rules.
<VirtualHost *:8081>
    DocumentRoot /var/www/motoapex/public_html
    SetEnv HTTPS on
    <Directory /var/www/motoapex>
        AllowOverride All
        Require all denied
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
